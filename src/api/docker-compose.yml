services:
  api:
    image: movie-api
    build:
      context: ../..
      dockerfile: src/api/Dockerfile
    container_name: movie-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: movie-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB}?sslmode=disable
    ports:
      - "9187:9187"
    restart: always

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: movie-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    depends_on:
      - api
      - postgres-exporter
    restart: always

  grafana:
    image: grafana/grafana:12.1.0
    container_name: movie-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: always
